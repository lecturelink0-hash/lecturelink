name: CPX integration

on:
  pull_request:
    paths:
      - 'app/**/cpx/**'
      - 'app/api/cpx/**'
      - 'components/cpx/**'
      - 'lib/cpx/**'
      - 'services/cpx/**'
      - 'supabase/migrations/00022_cpx_sessions.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cpx-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/**/cpx/**'
      - 'app/api/cpx/**'
      - 'components/cpx/**'
      - 'lib/cpx/**'
      - 'services/cpx/**'
      - 'supabase/migrations/00022_cpx_sessions.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cpx-ci.yml'

permissions:
  contents: read

jobs:
  lecturelink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run cpx:bundle-check
      - run: npm run cpx:sanitize-check
      - run: node --check scripts/test-cpx-deployment.mjs

  patient-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cpx/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/cpx/server/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py evaluate.py scoring.py prompt.py physical_exam.py db.py
      - run: python test_scoring.py
      - run: python test_time_analysis.py
      - run: python test_all_cases.py
      - run: python test_all_cases_api.py
      - run: python test_lecturelink_auth.py
      - run: python test_prompt_context.py
      - run: python test_patient_rules.py
      # 채점 입력 계약(역할·시각·종료 세션)과 인적사항 해석 회귀
      - run: python test_input_validation.py
      # 적신호 안전 게이트 — 정의 검증 + 놓치면 걸리고 다 하면 안 걸리는지 양방향
      - run: python test_safety_gates.py
      # 채점기가 케이스·진단을 받는지 (오진해도 만점 방지)
      - run: python test_case_aware_scoring.py
      # 진단명이 환자 모델 프롬프트로 새지 않는지 (제목·태그에 병명이 들어 있다)
      - run: python test_diagnosis_hidden.py
      # 런타임 위생 — 스키마 1회 실행·WAL·인증 기본값·정산 시각·조기 채점 차단
      - run: python test_runtime_hygiene.py
      # 버튼 행위 표시·검사 분리·문 앞 정보
      - run: python test_exam_actions.py
      # 채점 하드 타임아웃이 실제로 응답을 끊는지 — 옛 구조는 못 끊었음을 시간으로 재현
      - run: python test_evaluate_timeout.py
      - run: python test_low_compliance.py
      - run: python test_usage.py
      # 적대적 QA 하니스의 판정 로직 회귀 — 모델 호출 없이 돈다(API 키·쿼터 불필요)
      - run: python qa_leak_test.py selftest
