name: Ops metrics

# 계측은 없어도 서비스가 돌기 때문에, 깨져도 아무도 모른 채 발표 직전에 빈 대시보드를 본다.
# 산식(백분위·분모·재시도 판정)과 데이터셋 고정을 변경마다 검사한다.

on:
  pull_request:
    paths:
      - 'lib/metrics/**'
      - 'lib/stats/**'
      - 'lib/extract/chunk.ts'
      - 'lib/extract/chunk-id.ts'
      - 'lib/extract/page-text.ts'
      - 'lib/ai/context-segments.ts'
      - 'lib/rag/**'
      - 'lib/ai/embed.ts'
      - 'lib/extract/caption-image.ts'
      - 'lib/ai/rag-plan.ts'
      - 'lib/ai/type-plan.ts'
      - 'lib/ai/prompts/knowledge-rules.ts'
      - 'lib/ocr/engine.ts'
      - 'lib/ai/source-refs.ts'
      - 'lib/ai/versions.ts'
      - 'lib/ai/quality-checks.ts'
      - 'lib/ai/quality-gate.ts'
      - 'lib/ai/cost-cap.ts'
      - 'lib/ai/private-generation.ts'
      - 'lib/utils/api.ts'
      - 'app/(app)/admin/metrics/**'
      - 'datasets/**'
      - 'scripts/check-metrics.mjs'
      - 'scripts/check-item-stats.mjs'
      - 'scripts/check-source-tracking.mjs'
      - 'scripts/check-page-text.mjs'
      - 'scripts/check-dataset-split.mjs'
      - 'scripts/check-ocr-goldenset.mjs'
      - 'scripts/check-generation-repeatability.mjs'
      - 'scripts/check-upload-cost.mjs'
      - 'scripts/check-rag-eval.mjs'
      - 'scripts/check-rag-mode.mjs'
      - 'scripts/check-rag-caption.mjs'
      - 'scripts/check-rag-plan.mjs'
      - 'scripts/check-rag-pack.mjs'
      - 'supabase/migrations/00045_rag_index.sql'
      - 'supabase/migrations/00042_request_metrics.sql'
      - 'package.json'
      - '.github/workflows/metrics-ci.yml'
  push:
    branches: [main]
    paths:
      - 'lib/metrics/**'
      - 'lib/stats/**'
      - 'lib/extract/chunk.ts'
      - 'lib/extract/chunk-id.ts'
      - 'lib/extract/page-text.ts'
      - 'lib/ai/context-segments.ts'
      - 'lib/rag/**'
      - 'lib/ai/embed.ts'
      - 'lib/extract/caption-image.ts'
      - 'lib/ai/rag-plan.ts'
      - 'lib/ai/type-plan.ts'
      - 'lib/ai/prompts/knowledge-rules.ts'
      - 'lib/ocr/engine.ts'
      - 'lib/ai/source-refs.ts'
      - 'lib/ai/versions.ts'
      - 'lib/ai/quality-checks.ts'
      - 'lib/ai/quality-gate.ts'
      - 'lib/ai/cost-cap.ts'
      - 'lib/ai/private-generation.ts'
      - 'lib/utils/api.ts'
      - 'app/(app)/admin/metrics/**'
      - 'datasets/**'
      - 'scripts/check-metrics.mjs'
      - 'scripts/check-item-stats.mjs'
      - 'scripts/check-source-tracking.mjs'
      - 'scripts/check-page-text.mjs'
      - 'scripts/check-dataset-split.mjs'
      - 'scripts/check-ocr-goldenset.mjs'
      - 'scripts/check-generation-repeatability.mjs'
      - 'scripts/check-upload-cost.mjs'
      - 'scripts/check-rag-eval.mjs'
      - 'scripts/check-rag-mode.mjs'
      - 'scripts/check-rag-caption.mjs'
      - 'scripts/check-rag-plan.mjs'
      - 'scripts/check-rag-pack.mjs'
      - 'supabase/migrations/00045_rag_index.sql'
      - 'supabase/migrations/00042_request_metrics.sql'
      - 'package.json'
      - '.github/workflows/metrics-ci.yml'

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 산식 회귀 — 백분위·분모·재시도 판정·기능 이름·품질 게이트
      - run: npm run check:metrics
      # 출처 추적 — 청킹 결정론·구조적 출처 유효성 (분담표 A8)
      - run: npm run check:source-tracking
      # 페이지 단위 본문·청크 id·구간 헤더 보존 (RAG 실행계획 v1.1 0-b·0-c·0-d)
      - run: npm run check:page-text
      # 업로드당 원가 — 비용 귀속 컨텍스트 유지·집계 산식 (RAG 실행계획 v1.1 0-a)
      - run: npm run check:upload-cost
      # 검색 산식·평가 지표 — RRF·근거 팩 조립·인용구 회수·τ (RAG 실행계획 v1.1 E1~E3)
      - run: npm run check:rag-eval
      # RAG 모드·임베딩 배치·00045 스키마 — off 에서 인덱싱 경로를 타지 않는지 (RAG 실행계획 v1.1 0-e·0-g·0-h)
      - run: npm run check:rag-mode
      # 이미지 캡션 청크 — 이미지형 + shadow·on 에서만, 후보 이미지에만, 크롭 OCR 콜 불변 (RAG 실행계획 v1.1 0-f)
      - run: npm run check:rag-caption
      # 출제 계획·질의 — 입력 상한·출력 검사·쿼터 칸 배정, 계획 콜은 shadow·on 에서만·생성은 기다리지 않음 (RAG 실행계획 v1.1 5.2 C·D)
      - run: npm run check:rag-plan
      # 단위 검색·근거 팩 — MMR·글자 상한·충분성(τ)·근거 부족 교체, 검색은 shadow·on 에서 계획·인덱싱 뒤에만 (RAG 실행계획 v1.1 5.2 E·F)
      - run: npm run check:rag-pack
      # 문항 통계·층화 추출 산식 — KR-20·변별도·point-biserial 손계산 대조 (분담표 A12·A13)
      - run: npm run check:item-stats
      # 데이터 누수 방지 — 잠긴 테스트셋이 개발 중에 바뀌지 않았는지 (가이드 10.2)
      - run: npm run check:datasets
      # OCR 골든셋 구성·완결성 — 구축 중에는 경고만, --complete 로 완성 판정 (분담표 A5)
      - run: npm run check:ocr-goldenset
      # 문항 생성 반복 안정성 산식 — 모델 호출 없이 돈다 (실측은 ANTHROPIC_API_KEY 필요, 분담표 A3)
      - run: npm run check:gen-repeat -- --selftest
      - run: npm run typecheck
