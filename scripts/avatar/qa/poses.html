function aim(bn, cn, dirModel) {
  const b = bone(bn), c = bone(cn)
  const inner = grp.children[0].isGroup && grp.children[0].children[0] && grp.children[0].children[0].isGroup ? grp.children[0].children[0] : grp.children[0]
  const iq = new THREE.Quaternion(); inner.getWorldQuaternion(iq)

  b.updateWorldMatrix(true, false); c.updateWorldMatrix(true, false)
  const bp = new THREE.Vector3(), cp = new THREE.Vector3(); b.getWorldPosition(bp)
  if (cn.startsWith('Foot')) {  // Foot 은 IK 루트 본이라 자식이 아님 → 정강이 끝(바인드 상대행렬)으로 방향 계산
    ensureRel(); cp.setFromMatrixPosition(b.matrixWorld.clone().multiply(boneState.rel[cn.slice(-1)]))
  } else c.getWorldPosition(cp)

  const bw = new THREE.Quaternion(); b.getWorldQuaternion(bw)

function ik2(upperN, lowerN, endN, targetW, poleW) {
  const U = bone(upperN), L = bone(lowerN), E = bone(endN)
  U.updateWorldMatrix(true, false); L.updateWorldMatrix(true, false); E.updateWorldMatrix(true, false)
  const S = new THREE.Vector3(), Lp = new THREE.Vector3(), Ep = new THREE.Vector3()

function aimWorld(bn, cn, desiredW) {

  const cur = cp.sub(bp).normalize(), desired = desiredW.clone().normalize()
  const qw = new THREE.Quaternion().setFromUnitVectors(cur, desired)

function rollToward(bn, cn, refBone, palmAxisLocal, targetW) {
  const b = bone(bn), c = bone(cn), r = bone(refBone)
  b.updateWorldMatrix(true, false); c.updateWorldMatrix(true, false); r.updateWorldMatrix(true, false)
  const bp = new THREE.Vector3(), cp = new THREE.Vector3(); b.getWorldPosition(bp); c.getWorldPosition(cp)
  const axis = cp.sub(bp).normalize()

function detectPalmAxis() {
  // 손 정점(Wrist·손가락 본 지배)을 손목 본 로컬로 옮겨 가장 얇은 축 = 손바닥 법선. 부호는 바인드 T포즈에서 아래(-up)를 향하도록
  const sk = skinned[0].skeleton
  const hi = sk.bones.findIndex((b) => /^Head$/.test(b.name)), pi = sk.bones.findIndex((b) => /^Hips$/.test(b.name))
  const Bh = sk.boneInverses[hi].clone().invert(), Bp = sk.boneInverses[pi].clone().invert()
  const upBind = new THREE.Vector3().setFromMatrixPosition(Bh).sub(new THREE.Vector3().setFromMatrixPosition(Bp)).normalize()
  for (const side of ['L', 'R']) {
    const wi = sk.bones.findIndex((b) => b.name === 'Wrist' + side)
    const handRe = new RegExp('^(Wrist|Index\\d|Middle\\d|Ring\\d|Pinky\\d|Thumb\\d)' + side + '$')
    const handIdx = new Set(sk.bones.map((b, i) => handRe.test(b.name) ? i : -1).filter((i) => i >= 0))
    const inv = sk.boneInverses[wi]
    const mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9]; const v = new THREE.Vector3()
    for (const o of skinned) {
      const pos = o.geometry.attributes.position, si = o.geometry.attributes.skinIndex, sw = o.geometry.attributes.skinWeight
      for (let i = 0; i < pos.count; i++) {
        let best = 0, bw = -1; for (let k = 0; k < 4; k++) { const w = sw.getComponent(i, k); if (w > bw) { bw = w; best = si.getComponent(i, k) } }
        if (!handIdx.has(best)) continue

        for (let k = 0; k < 3; k++) { const c = v.getComponent(k); if (c < mn[k]) mn[k] = c; if (c > mx[k]) mx[k] = c }
      }
    }
    const ext = [0, 1, 2].map((k) => mx[k] - mn[k])
    const thin = ext.indexOf(Math.min(...ext))
    const axis = new THREE.Vector3(); axis.setComponent(thin, 1)
    const rot = new THREE.Matrix3().setFromMatrix4(inv.clone().invert())
    const worldAxis = axis.clone().applyMatrix3(rot).normalize()
    if (worldAxis.dot(upBind) > 0) axis.negate()

function modelToWorld(v) {
  const inner = grp.children[0].isGroup && grp.children[0].children[0] && grp.children[0].children[0].isGroup ? grp.children[0].children[0] : grp.children[0]
  const iq = new THREE.Quaternion(); inner.getWorldQuaternion(iq); return new THREE.Vector3(...v).applyQuaternion(iq)

function armsCross() {
  scene.updateMatrixWorld(true)
  const sL = new THREE.Vector3(), sR = new THREE.Vector3(); bone('UpperArm.L').getWorldPosition(sL); bone('UpperArm.R').getWorldPosition(sR)
  // 오른손 → 왼쪽 어깨 바로 위(약간 앞), 왼손 → 오른쪽 어깨 위(그보다 앞·위: 왼팔이 앞을 지남)
  const tR = sL.clone().add(modelToWorld([0.0, 0.05, 0.03])), tL = sR.clone().add(modelToWorld([0.0, 0.07, 0.17]))
  const pR = sR.clone().add(modelToWorld([0.15, -0.3, 0.12])), pL = sL.clone().add(modelToWorld([-0.15, -0.25, 0.5]))
  ik2('UpperArm.R', 'LowerArm.R', 'Wrist.R', tR, pR)

  // 손: 손가락이 어깨 뒤쪽·아래로 감기게, 손바닥은 아래(어깨 위에 얹힘)
  aim('Wrist.R', 'Middle1.R', [0.35, 0.15, -0.9]); aim('Wrist.L', 'Middle1.L', [-0.35, 0.15, -0.9])
  rollToward('Wrist.R', 'Middle1.R', 'Wrist.R', palmAxis.R, new THREE.Vector3(0, -1, 0))

function palmsDown(top, bottom) {
  // 팔뚝 회내(pronation)로 손바닥 법선을 월드 -y(침대)로: 위쪽 팔·아래쪽 팔 모두
  for (const side of [top, bottom]) {
    rollToward('LowerArm.' + side, 'Wrist.' + side, 'Wrist.' + side, palmAxis[side], new THREE.Vector3(0, -1, 0))
    rollToward('Wrist.' + side, 'Middle1.' + side, 'Wrist.' + side, palmAxis[side], new THREE.Vector3(0, -1, 0))

}
function applyOffsets(list, scaleLateral) {
  // 좁은 어깨(lateralK<1)일수록 팔짱 가로 성분을 줄이고 팔뚝을 더 세워(y↑) 반대편 상완 관통을 피한다
  for (const [bn, cn, d] of list) aim(bn, cn, scaleLateral ? [d[0] * lateralK, d[1] + (bn.startsWith('LowerArm') ? (1 - lateralK) * 0.6 : 0), d[2]] : d)
}

function ensureRel() {
  if (boneState.rel) return
  boneState.rel = {}
  const sk = skinned[0].skeleton
  for (const side of ['L', 'R']) {
    const ll = bone('LowerLeg.' + side), ft = bone('Foot.' + side)
    const li = sk.bones.indexOf(ll), fi = sk.bones.indexOf(ft)
    boneState.rel[side] = sk.boneInverses[li].clone().multiply(sk.boneInverses[fi].clone().invert())
  }
}
// Foot(IK 루트 본)을 정강이 끝에 부착
function attachFeet() {
  ensureRel()
  for (const side of ['L', 'R']) {
    const ll = bone('LowerLeg.' + side), ft = bone('Foot.' + side)
    if (!ll || !ft) continue
    const sk = skinned[0].skeleton
    const li = sk.bones.indexOf(ll), fi = sk.bones.indexOf(ft)
    if (li < 0 || fi < 0) continue
    ll.updateWorldMatrix(true, false)
    const desired = ll.matrixWorld.clone().multiply(boneState.rel[side])
    ft.parent.updateWorldMatrix(true, false)
    const local = ft.parent.matrixWorld.clone().invert().multiply(desired)
    local.decompose(ft.position, ft.quaternion, ft.scale)
  }
}

function posedBox(excludeRe) {
  scene.updateMatrixWorld(true); root.updateMatrixWorld(true)
  const box = new THREE.Box3(); const v = new THREE.Vector3()
  for (const o of skinned) {
    o.skeleton.update(); const pos = o.geometry.attributes.position; const si = o.geometry.attributes.skinIndex, sw = o.geometry.attributes.skinWeight
    for (let i = 0; i < pos.count; i++) {
      if (excludeRe && si && sw) { let best = 0, bw = -1; for (let k = 0; k < 4; k++) { const w = sw.getComponent(i, k); if (w > bw) { bw = w; best = si.getComponent(i, k) } }
        const bn = o.skeleton.bones[best]; if (bn && excludeRe.test(bn.name)) continue }
      v.fromBufferAttribute(pos, i); o.applyBoneTransform(i, v); v.applyMatrix4(o.matrixWorld); box.expandByPoint(v)
    }
  }
  return box
}

loader.load(dir + file + '.glb', (g) => {
  root = SkeletonUtils.clone(g.scene)
  root.traverse((o) => { if (o.isSkinnedMesh) skinned.push(o); if (o.material) [].concat(o.material).forEach((m) => { if (COLOR_FIX[m.name]) m.color.set(COLOR_FIX[m.name]); o.castShadow = true }) })
  // 키 정규화 (기본 포즈 실측)
  const box0 = posedBox(); const s = H / (box0.max.y - box0.min.y)
  const inner = new THREE.Group(); inner.add(root); inner.scale.setScalar(s); inner.position.y = -box0.min.y * s
  grp = new THREE.Group(); grp.add(inner); scene.add(grp)
  const clip = g.animations.find((a) => /(^|\|)Idle_Neutral$/.test(a.name)) || g.animations.find((a) => /(^|\|)Idle$/.test(a.name))
  if (clip) { mixer = new THREE.AnimationMixer(root); mixer.clipAction(clip).play() }
  boneState = { resolved: new Map() }
  detectPalmAxis()
  // 어깨 반폭(UpperArm.L x, 정규화 후) 기준 팔짱 가로 성분 보정 — 좁은 어깨(여)에서 손이 반대편 상완을 관통하지 않도록
  { scene.updateMatrixWorld(true); const v = new THREE.Vector3(); bone('UpperArm.L').getWorldPosition(v); const inner = grp.children[0]; const half = Math.abs(v.x - grp.position.x) * (inner.scale ? 1 : 1); lateralK = Math.min(1, Math.max(0.6, half / 0.147)) }
  camera.position.set(...P.cam); camera.lookAt(...P.look)
  document.getElementById('ui').textContent = `${file}\npose=${pose} clip=${clip ? clip.name : 'none'}`
  for (let i = 0; i < 8; i++) tick2()  // 백그라운드 탭에서도 배치·포즈가 완성되도록 동기 스텝
  window.__ready = true
}, undefined, (e) => { document.getElementById('ui').textContent = 'ERR ' + e.message })

let placed = false
window.__err = null
window.__frames = 0
window.__arms = () => {
  scene.updateMatrixWorld(true)
  const P_ = (n) => { const v = new THREE.Vector3(); bone(n).getWorldPosition(v); return v }
  const segDist = (a0, a1, b0, b1) => { // 선분 간 최소 거리(근사: 샘플링)
    let m = 1e9; for (let i = 0; i <= 10; i++) for (let j = 0; j <= 10; j++) { const pa = a0.clone().lerp(a1, i / 10), pb = b0.clone().lerp(b1, j / 10); m = Math.min(m, pa.distanceTo(pb)) } return m }
  const eL = P_('LowerArm.L'), wL = P_('Wrist.L'), eR = P_('LowerArm.R'), wR = P_('Wrist.R'), sL = P_('UpperArm.L'), sR = P_('UpperArm.R'), mL = P_('Middle1.L'), mR = P_('Middle1.R')
  return { wristL: wL.toArray().map(v => +v.toFixed(3)), wristR: wR.toArray().map(v => +v.toFixed(3)), handL: mL.toArray().map(v => +v.toFixed(3)), handR: mR.toArray().map(v => +v.toFixed(3)),
    shoulderL: sL.toArray().map(v => +v.toFixed(3)), shoulderR: sR.toArray().map(v => +v.toFixed(3)),
    forearmGap: +segDist(eL, wL, eR, wR).toFixed(3), foreVsUpper: +Math.min(segDist(eL, wL, sR, eR), segDist(eR, wR, sL, eL)).toFixed(3), bedTop: BED.top }
}
window.__dirs = () => {
  const b = bone('UpperLeg.L'), c = bone('LowerLeg.L'); scene.updateMatrixWorld(true)
  const bp = new THREE.Vector3(), cp = new THREE.Vector3(); b.getWorldPosition(bp); c.getWorldPosition(cp)
  const inner = grp.children[0].isGroup && grp.children[0].children[0] && grp.children[0].children[0].isGroup ? grp.children[0].children[0] : grp.children[0]
  const iq = new THREE.Quaternion(); inner.getWorldQuaternion(iq)
  const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(iq), up = new THREE.Vector3(0, 1, 0).applyQuaternion(iq)
  return { leg: cp.sub(bp).normalize().toArray().map(v => +v.toFixed(2)), innerName: inner === root ? 'root' : 'group', fwd: fwd.toArray().map(v => +v.toFixed(2)), up: up.toArray().map(v => +v.toFixed(2)), grpRot: grp.rotation.toArray().slice(0,3).map(v => +v.toFixed(2)), depth: (() => { let d = 0, o = inner; while (o && o !== scene) { d++; o = o.parent } return d })() }
}
window.__step = () => { try { tick2(); return 'ok' } catch (e) { return String(e.stack || e) } }
window.__dbg = () => { const b = root ? posedBox() : null; return { cam: camera.position.toArray(), children: scene.children.length, grp: grp && grp.position.toArray(), grpScale: grp && grp.children[0].scale.x, box: b && [b.min.toArray(), b.max.toArray()], placed, calls: renderer.info.render.calls } }
window.addEventListener('error', (e) => { window.__err = e.message + ' @' + e.lineno })
function tick() {
  try { tick2() } catch (e) { window.__err = String(e.stack || e); renderer.render(scene, camera); requestAnimationFrame(tick) }
}
function tick2() {
  window.__frames++
  const d = Math.min(clock.getDelta(), 0.05) || 0.033
  if (root) {
    if (mixer) mixer.update(d)
    root.updateMatrixWorld(true)
    applyOffsets(LEG_SETS[P.legs])
    if (P.arms === 'cross') armsCross(); else applyOffsets(ARM_SETS[P.arms])
    if (P.arms === 'side_left') palmsDown('R', 'L'); if (P.arms === 'side_right') palmsDown('L', 'R')
    root.updateMatrixWorld(true)
    attachFeet()
    if (!placed) {
      // 배치: 의자 — 발이 바닥, 골반 높이에 좌석 / 침대 — 눕기 변환 후 최저점이 침대 상판
      const inner = grp.children[0]
      if (P.place === 'chair') {
        const b = posedBox(); inner.position.y += -b.min.y
        root.updateMatrixWorld(true)
        const hip = new THREE.Vector3(); bone('Hips').getWorldPosition(hip)
        addChair(hip.y - 0.06)
        placed = true
      } else {
        // 앙와위: 모델 (x,y,z)→(-y,z,-x) : 머리 -x, 얼굴 +y
        grp.rotation.set(-Math.PI / 2, 0, Math.PI / 2)
        if (P.roll) {
          const outer = new THREE.Group(); scene.remove(grp); outer.add(grp); scene.add(outer)
          outer.rotation.x = deg(P.roll) // 몸 장축(월드 x) 기준 굴림
          grp = outer
        }
        addBed()
        root.updateMatrixWorld(true)
        const b = posedBox(/Arm|Wrist|Index|Middle|Ring|Pinky|Thumb|Shoulder/)  // 팔·손은 침대 접촉 기준에서 제외
        grp.position.y += BED.top - b.min.y
        grp.position.x += -0.95 + 0.1 - b.min.x
        placed = true
      }
    }
  }
  renderer.render(scene, camera); requestAnimationFrame(tick)
}
tick()
</script></body></html>
